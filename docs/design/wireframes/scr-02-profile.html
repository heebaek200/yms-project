<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCR-02 프로필 설정</title>
    <link rel="stylesheet" href="./wireframe.css">
</head>
<body>
<main class="wireframe-page">
    <header class="wireframe-header">
        <h1>SCR-02. 프로필 설정</h1>
        <p>접근 권한: 인증 사용자 / 본인 프로필</p>
    </header>

    <section class="screen-frame modal-preview">
        <h2 class="section-title">기본 프로필</h2>

        <div class="form-group">
            <label>이메일</label>
            <input type="text" value="creator@example.com" disabled>
        </div>

        <div class="form-group">
            <label>이름 / 닉네임</label>
            <input type="text" value="김크리에이터">
        </div>

        <h2 class="section-title">전문 역할</h2>
        <div class="checkbox-row">
            <label><input type="checkbox" checked> 크리에이터</label>
            <label><input type="checkbox"> 콘텐츠 기획자</label>
            <label><input type="checkbox"> 작가</label>
            <label><input type="checkbox"> 촬영 담당</label>
            <label><input type="checkbox"> 영상 편집자</label>
            <label><input type="checkbox"> 썸네일 디자이너</label>
        </div>
        <p class="help-text">크리에이터를 선택하면 조회수 기반 예상 수익 계산에 사용할 롱폼·쇼츠 기본 단가를 설정할 수 있습니다.</p>

        <section class="panel">
            <h3>CREATOR 기본 수익 단가</h3>

            <div class="notice">
                <p>처음 설정할 때 참고할 수 있는 예시입니다.</p>
                <strong>롱폼 약 3.00원/조회 · 쇼츠 약 0.20원/조회</strong>
                <p>채널과 콘텐츠에 따라 실제 수익은 달라질 수 있습니다.</p>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>롱폼 조회수 1회당 수익 단가</label>
                    <input type="number">
                </div>
                <div class="form-group">
                    <label>쇼츠 조회수 1회당 수익 단가</label>
                    <input type="number" step="0.000001">
                </div>
            </div>

            <p class="help-text">입력하지 않은 롱폼·쇼츠 단가는 0원으로 저장됩니다.</p>

            <div class="form-group">
                <label>변경 적용 범위</label>
                <select>
                    <option>향후 프로젝트만</option>
                    <option>기존 미확정 프로젝트에도 적용</option>
                </select>
            </div>

            <p class="help-text">프로젝트에는 실제 적용 단가가 별도 스냅샷으로 저장됩니다.</p>
        </section>

        <button class="action-button" type="button">설정 저장</button>
    </section>
</main>
</body>
</html>
