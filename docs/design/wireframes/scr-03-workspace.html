<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCR-03 워크스페이스 선택 / 생성 / 초대</title>
    <link rel="stylesheet" href="./wireframe.css">
</head>
<body>
<main class="wireframe-page">
    <header class="wireframe-header">
        <h1>SCR-03. 워크스페이스 선택 / 생성 / 초대</h1>
        <p>접근 권한: 인증 사용자</p>
    </header>

    <div class="row between">
        <h2>내 워크스페이스</h2>
        <button class="small-button" type="button">+ 새 Workspace</button>
    </div>

    <section class="grid-3">
        <article class="card">
            <strong>YMS Media Team</strong>
            <p>권한: OWNER</p>
            <p>참여 프로젝트: 8</p>
            <button class="small-button" type="button">입장</button>
        </article>
        <article class="card">
            <strong>Sample Creator Team</strong>
            <p>권한: MEMBER</p>
            <p>참여 프로젝트: 3</p>
            <button class="small-button" type="button">입장</button>
        </article>
        <article class="card">
            <strong>개인 작업실</strong>
            <p>권한: OWNER</p>
            <p>참여 프로젝트: 2</p>
            <button class="small-button" type="button">입장</button>
        </article>
    </section>

    <section class="screen-frame" style="margin-top: 24px;">
        <h2 class="section-title">대기 중 초대</h2>
        <ul class="list">
            <li class="list-item">
                <strong>Game Channel Studio</strong>
                <p>초대한 사용자: 박관리자</p>
                <div class="row">
                    <button class="small-button" type="button">수락</button>
                    <button class="small-button" type="button">거절</button>
                </div>
            </li>
        </ul>
    </section>
</main>
</body>
</html>
